<div>
<h2>{{ titulo }}</h2>

@if (zapatillas.length > 0) {
  <ul>
    @for (z of zapatillas; track z.Modelo) {
      <li>
        <b>{{ z.Marca }}</b> - {{ z.Modelo }} ({{ z.Color }})
        | {{ z.Precio }}€
        | stock: {{ z.Stock }}
      </li>
    }
  </ul>
} @else {
  <p>No hay zapatillas.</p>
}

<br><br>
<button [routerLink]="['/videojuegos']">Ir a Videojuegos</button>
<a [routerLink]="['/externo']" routerLinkActive="active"> Ir a externo</a>

</div>
