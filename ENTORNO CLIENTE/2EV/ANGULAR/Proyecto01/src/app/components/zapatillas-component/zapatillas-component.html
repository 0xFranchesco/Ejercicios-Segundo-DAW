<div>
<h1>{{ titulo }}</h1>

<ul>

    <li *ngFor="let zapatilla of zapatillas">

     
        {{ zapatilla.Marca }} - 
        {{ zapatilla.Color }} - 
        {{ zapatilla.Modelo }} -
        {{ zapatilla.Precio }} € 
    <span *ngIf="zapatilla.Precio <= 80"
        style="color: rgb(26, 255, 0); font-weight: bold;">
         EN OFERTA! 
    </span> -
        {{ zapatilla.Stock }}
      
    </li>

</ul>

</div>
