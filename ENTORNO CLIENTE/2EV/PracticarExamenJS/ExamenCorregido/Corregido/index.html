<!doctype html>
<html>

<head>
	<meta charset="UTF-8" meta charset="UTF-8">
	<title> Examen con fotos y tablas </title>

	<style>
		.ocultar {
			display: none;
		}

		.fotos {
			/* defino una clase para cambiar el tamaño de las fotos */
			width: 100px;
			height: 100px;
		}

		.amplia {
			/* defino una clase para cambiar el tamaño de las fotos ampliadas*/
			width: 500px;
			height: 500px;
		}

		.recolocar {
			/* defino una clase para recolocar el div de la foto ampliada */
			position: fixed;
			top: 50px;
			right: 30px;
		}

		#size{
			padding: 5px 10px; background: white; border: 1px solid black; border-radius: 4px; font-size: 14px; z-index: 9999;
		}

		table,
		tr,
		td {
			border: solid 1px black;
			border-collapse: collapse;
		}
	</style>


	<script type="text/javascript">

		let listaFotos = [
			{
				"nombre": "FB_IMG_1685577146004",
				"tipo": "jpg",
				"tamanno": "95.477",
				"tematica": ["Web", "Programacion"]
			},
			{
				"nombre": "FB_IMG_1676156609518",
				"tipo": "jpg",
				"tamanno": "22.089",
				"tematica": "Programacion"
			},
			{
				"nombre": "FB_IMG_1667318456231",
				"tipo": "jpg",
				"tamanno": "83.212",
				"tematica": "Programacion"
			},
			{
				"nombre": "FB_IMG_1678917723620",
				"tipo": "jpg",
				"tamanno": "45.624",
				"tematica": ["Web", "programacion"]
			},
			{
				"nombre": "FB_IMG_1699051552872",
				"tipo": "jpg",
				"tamanno": "63.303",
				"tematica": "Programacion"
			},
			{
				"nombre": "FB_IMG_1645211597935",
				"tipo": "jpg",
				"tamanno": "74.104",
				"tematica": ["Web", "programacion"]
			}
		];

	</script>
</head>

<body>
	<div id="destino"> </div> <!-- Aquí pondré la tabla -->
	</div>

	<div id="ampliada"> </div> <!-- Aquí pondré las fotos ampliadas que saldrán en el lado derecho -->
	</div>

	<br />
	<br />
	<input type="button" value="Enviar al servidor las seleccionadas" name="boton">

	<br />
	<br />
	<p id="p"> Pulsa F1 para ordenar por nombre las fotos </p>

	<dialog id="size" style="position:absolute; margin:0;"></dialog>
	<!-- Diálogo que mostrará el tamaño de la foto al pasar el ratón por encima -->


	<script>
		window.addEventListener("load", ev => {
			let url = "http://localhost:3000/datosFotos";
			let contTabla = document.getElementById("destino");

			//Crea y muestra la tabla
			function mostrarTabla() { 
				let tabla = document.createElement("table");
				contTabla.appendChild(tabla);
				listaFotos.forEach(foto => {
					let tr = document.createElement("tr");

					tr.innerHTML = `
						<td><img class="fotos" src="assets/${foto.nombre}.jpg" width="100px"></td>
						<td class="nombre" data-tam="${foto.tamanno}">${foto.nombre}</td>
						<td><input type="checkbox">Enviarla</td>
					`;
					tabla.appendChild(tr);
				});
			}

			//Cuando pulso cualquier parte de la pantalla cambia el texto durante un intervalo de tiempo
			function intervalo() {
				p.textContent = "No sirve de nada pulsar aqui...";
				setTimeout(() => {
					p.textContent = "Pulsa F1 para ordenar por nombre las fotos";
				}, 2000);
			}

			//Muestra el dialogo con el peso de cada imagen.
			function mostrarCartelito(){
				let nombres = document.getElementsByClassName("nombre");
				let dialogo = document.getElementById("size");

				for(let nombre of nombres){
					nombre.addEventListener("mousemove", (ev)=>{
						let tam = nombre.dataset.tam;
						dialogo.textContent= tam + "KB";

						dialogo.style.left = (ev.pageX + 15) + "px";
						dialogo.style.top = (ev.pageY + 15) + "px";

						if(!dialogo.open) dialogo.show();
					});

					nombre.addEventListener("mouseout", (ev)=>{
						dialogo.close();
					});
				}
			}

			//Cuando pulso una imagen aparece ampliada a la derechadurante 3 segundos
			function ampliarImagen(){
				let fotos = document.getElementsByClassName("fotos");
				let ampliada = document.getElementById("ampliada");

				for (let foto of fotos){
					foto.addEventListener("click", (ev)=>{

						ev.stopPropagation(); //Para que no salga el mensaje "no sirve de nada pulsar aqui"

						if(ampliada.children.length === 0){ //Si no tiene ningún hijo se ejecuta
							let clon = foto.cloneNode();
							ampliada.appendChild(clon);
							ampliada.className="recolocar";
							clon.className="amplia";

							//Cuando pasen 3 segundos la imagen desaparece
							setTimeout(()=>{
								ampliada.replaceChildren(); //Para que cuando hay una foto mostrandose no se puedan poner más hasta que se quite.
							}, 3000);
						} else{
							console.log("Ya hay algo dentro, espera a que se quite");
						}

						
					});
				}
			}

			//Manda los datos a un servidor json
			async function enviarDatos() {
				let checks = document.querySelectorAll("input[type='checkbox']:checked");
				console.log("Funcionaaaaaaa!!!");
				if (checks.length > 0) {

					let datos = Array.from(checks).map(check => {
						let fila = check.closest("tr");
						let celdas = fila.querySelectorAll("td");
						let nombre = Array.from(celdas).map(td => td.textContent.trim());
						
						return Array.from(listaFotos).filter(
							infoFoto => infoFoto.nombre === nombre[1]
						);
					});

					try {
						let respuesta = await fetch(url, {
							method: "POST",
							headers: {
								"Content-Type": "application/json"
							},
							body: JSON.stringify(datos)
						});

						let data = await respuesta.json();
						console.log("Producto guardado: ", data);
					} catch (error) {
						console.log("No se ha podido enviar los datos.")
					}
				} else {
					console.log("No se han seleccionado checkboxes");
				}

			}
			
			mostrarTabla();
			mostrarCartelito();
			ampliarImagen();

			//Cuando pulso F1 se ordena la lista por nombre
			document.addEventListener("keydown", (ev)=>{
				if(ev.key === "F1"){
					ev.preventDefault(); //Me quita lo que sea que haga F1 en el navegador
					listaFotos.sort((a, b) => a.nombre.localeCompare(b.nombre));
					contTabla.innerHTML = "";

					//Reinicio todas las funciones
					mostrarTabla();
					mostrarCartelito();
					ampliarImagen();
				}
			});

			//Cuando hago click en el documento se ejecuta la funcion
			document.addEventListener("click", intervalo);

			//Impide que se ejecute la funcion intervalo cuando hago click a un checkbox
			document.querySelectorAll("input[type='checkbox']").forEach(prop=>{
				prop.addEventListener("click", e=> e.stopPropagation());
			});

			//Impide que se ejecute la funcion intervalo cuando hago click al boton y ejecuta la funcion enviarDatos();
			document.querySelector("input[type='button']").addEventListener("click", (e)=>{
				e.stopPropagation();
				enviarDatos();
			});
		});


	</script>


</body>

</html>
