<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperación JS - Gestión de usuarios</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      #zonaTabla {
        width: 70%;
      }
      #zonaFicha {
        width: 30%;
        min-height: 200px;
        border: 1px solid #ccc;
        padding: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 8px;
        text-align: left;
      }
      img.avatar {
        width: 50px;
        height: 50px;
        object-fit: cover;
        cursor: pointer;
      }
      #mensaje {
        margin: 10px 0;
        padding: 10px;
        border: 1px dashed #666;
      }
      .oculto {
        display: none;
      }
      .checkbox {
        margin-left: 45%;
      }
      dialog {
        position: absolute;
        margin: 0;
      }
      .btnAceptar {
        background-color: rgb(31, 255, 61);
        color: white;
        margin: 20px;
        padding: 5px;
      }
      .btnCancelar {
        background-color: rgb(255, 0, 0);
        color: white;
        margin: 20px;
        padding: 5px;
      }

    </style>
  </head>

  <body>
    <h2>Gestión de usuarios</h2>

    <div id="mensaje">Pulsa F1 para ordenar…</div>

    <div id="layout">
      <div id="zonaTabla">
        <table id="tablaUsuarios">
          <thead>
            <tr>
              <th>Id</th>
              <th>Nombre completo</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Fecha alta</th>
              <th>Antigüedad (años)</th>
              <th>Edad</th>
              <th>Marcar</th>
              <th>Editar</th>
            </tr>
          </thead>
          <tbody id="tbodyUsuarios">
            <!-- Filas generadas por JS -->
          </tbody>
        </table>

        <div id="tooltip"></div>

        <br />
        <button id="btnEnviar">Enviar al servidor los seleccionados</button>
      </div>

      <div id="zonaFicha">
        <strong>Ficha usuario (click en Nombre)</strong>
        <div id="fichaContenido"></div>
      </div>
    </div>

    <script type="text/javascript">
      window.addEventListener("load", () => {
        let tablaUsuarios = document.getElementById("tablaUsuarios");
        let mensaje = document.getElementById("mensaje");
        let fichaContenido = document.getElementById("fichaContenido");
        let tooltip = document.getElementById("tooltip");
        let dialog = document.createElement("dialog");
        let btnEnviar = document.getElementById("btnEnviar");

        let usuarios = [];

        document.addEventListener("click", (e) => {
          let elemento = e.target;
          if (
            elemento.closest("input") ||
            elemento.closest("td") ||
            elemento.closest("button") ||
            elemento.closest("tr")
          ) {
            return;
          } else {
            mensaje.textContent = `No sirve de nada pulsar aquí`;
            setTimeout(() => {
              mensaje.textContent = `Pulsa F1 para ordenar…`;
            }, 3000);
          }
        });

        traerUsuarios();

        async function traerUsuarios(params) {
          let respuesta = await fetch("http://localhost:3000/usuarios");
          if (!respuesta.ok) {
            throw new Error("Error al traer los usuarios");
          }
          usuarios = await respuesta.json();
          pintarUsuarios();
        }

        function pintarUsuarios() {
          for (let usuario of usuarios) {
            let tdId = document.createElement("td");
            let tdNombre = document.createElement("td");
            let tdEmail = document.createElement("td");
            let tdRol = document.createElement("td");
            let tdFechaAlta = document.createElement("td");
            let tdAntiguedad = document.createElement("td");
            let tdEdad = document.createElement("td");
            let tdCheck = document.createElement("td");
            let tdEditar = document.createElement("td");

            let tr = document.createElement("tr");

            tdId.textContent = `${usuario.id}`;
            tr.appendChild(tdId);

            tdNombre.textContent = `${usuario.nombre} ${usuario.apellidos}`;
            tr.appendChild(tdNombre);

            tdNombre.addEventListener("click", (e) => {
              fichaContenido.appendChild(tr);
              setTimeout(() => {
                tablaUsuarios.appendChild(tr);
              }, 3000);
            });

            tdNombre.addEventListener("mouseenter", (e) => {
              dialog.style.left = e.pageX + 15 + "px";
              dialog.style.top = e.pageY + 15 + "px";
              dialog.textContent = `El cumpleaño de ${usuario.nombre} es el ${cumpleaños}`;
              dialog.show();
              tooltip.appendChild(dialog);
            });
            tdNombre.addEventListener("mouseleave", () => {
              dialog.close();
            });

            tdEmail.textContent = `${usuario.email}`;
            tr.appendChild(tdEmail);

            tdRol.textContent = `${usuario.rol}`;
            tr.appendChild(tdRol);

            tdFechaAlta.textContent = `${usuario.fechaAlta}`;
            tr.appendChild(tdFechaAlta);

            let fechaActual = new Date();
            let fechaAlta = new Date(usuario.fechaAlta);
            let fechaNacimiento = new Date(usuario.fechaNacimiento);
            let edad = fechaActual - fechaNacimiento;
            let cumpleaños = usuario.fechaNacimiento;
            cumpleaños = cumpleaños.slice(5);
            edad = edad / (1000 * 60 * 60 * 24 * 365);
            edad = edad.toFixed(0);

            let antiguedad = fechaActual - fechaAlta;
            antiguedad = antiguedad / (1000 * 60 * 60 * 24 * 365);
            antiguedad = antiguedad.toFixed(0);

            tdAntiguedad.textContent = `${antiguedad}`;
            tr.appendChild(tdAntiguedad);

            tdEdad.textContent = `${edad}`;
            tr.appendChild(tdEdad);

            let check = document.createElement("input");
            check.type = "checkbox";
            check.classList.add("checkbox");
            check.dataset.id = usuario.id;
            check.dataset.nombre = `${usuario.nombre} ${usuario.apellidos}`;
            tdCheck.appendChild(check);
            tr.appendChild(tdCheck);

            let btnEditar = document.createElement("button");
            btnEditar.textContent = `Editar`;
            tdEditar.appendChild(btnEditar);
            tr.appendChild(tdEditar);

            btnEditar.addEventListener(("click"), (e) => {
              tdId.textContent = "";
              let id = document.createElement("input");
              tdId.appendChild(id);

              tdNombre.textContent = "";
              let nombre = document.createElement("input");
              tdNombre.appendChild(nombre);

              tdEmail.textContent = "";
              let email = document.createElement("input");
              tdEmail.appendChild(email);

              tdRol.textContent = "";
              let rol = document.createElement("input");
              tdRol.appendChild(rol);

              tdFechaAlta.textContent = "";
              let fechaAlta = document.createElement("input");
              tdFechaAlta.appendChild(fechaAlta);

              tdAntiguedad.textContent = "";
              let antiguedad = document.createElement("input");
              tdAntiguedad.appendChild(antiguedad);

              tdEdad.textContent = "";
              let edad = document.createElement("input");
              tdEdad.appendChild(edad);

              let btnAceptar = document.createElement("button");
              btnAceptar.textContent = "Aceptar";
              btnAceptar.classList.add("btnAceptar");

              let btnCancelar = document.createElement("button");
              btnCancelar.textContent = "Cancelar";
              btnCancelar.classList.add("btnCancelar");

              tooltip.appendChild(btnAceptar);
              tooltip.appendChild(btnCancelar);

              tdNombre.addEventListener("click", (e) => {
                e.stopPropagation();
              });

              btnAceptar.addEventListener("click", (e) => {
                  e.preventDefault();
                  tdId.textContent = `${id.value}`;

              });

              btnCancelar.addEventListener("click", (e) => {
                location.reload();
              });
              
            });

            tablaUsuarios.appendChild(tr);
          }
        }

        btnEnviar.addEventListener("click", async(e) => {

          let marcados = document.querySelectorAll(".checkbox:checked");

          for (let marcado of marcados) {
            await enviarUsuarioSeleccionado({id : marcado.dataset.id, nombre : marcado.dataset.nombre});
          }

        });

        async function enviarUsuarioSeleccionado(usuario) {

          try {

            let respuesta = await fetch("http://localhost:3000/seleccionados", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(usuario),
            });

            if (!respuesta.ok) {
              throw new Error("Errorrrrr");
            }

            let seleccionado = await respuesta.json();
            console.log(seleccionado);
            alert("Usuario enviado correctamente.");
          } catch (error) {
            console.log("Erorr loco");
          }

        }

        document.addEventListener("keydown", (e) => {
          if (e.key === "F1") {
            e.preventDefault();
            usuarios.sort((a, b) => {
              return a.nombre.localeCompare(b.nombre);
            });
            tablaUsuarios.textContent = "";
            pintarUsuarios();
          }
        });



      });
    </script>
  </body>
</html>
