<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fran Castaño</title>
    <script
    src='https://ajax.googleapis.com/ajax/libs/jquery/3.0.0/jquery.min.js'>
    </script>

    <style>

       #marco {


        border: 3px solid black;

       }

       #btn1 {

        margin-bottom: 30px;
        margin-left: 15px;
        border: 2px solid black;
        padding: 5px;

       }

       #marcar {

        margin-left: 40px;
        margin-bottom: 30px;

       }
       

    </style>

</head>
<body>

    <div id="marco">


        <ul>
            <li><h2>Elemento 1</h2></li>
            <li><h2>Elemento 2</h2></li>
            <li><h2>Elemento 3</h2></li>
        </ul>

        <div id="marcar">
        <button id="btn1">Marcar 2º elemento</button>
        </div>
    </div>

    <script>
    $(document).ready(function(e){


         $.expr[':'].second = function(elem, index, meta) {
            return $(elem).index() === 1;
        };

       
        $('#btn1').click(function(){

            $('li:second').css('color', 'orange');

        });


    });
    </script>

</body>
</html>
