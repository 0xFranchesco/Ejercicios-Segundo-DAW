<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejercicio A</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .wrap{max-width:760px;margin:28px auto;border:2px solid #1a73e8;padding:18px;border-radius:12px}
    .cardx{padding:12px;border:1px solid #ddd;border-radius:12px;margin:10px 0}
    .tag{font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <h3 class="text-center">Notas y etiquetas</h3>

    <div class="cardx">
      <div class="tag">Etiqueta: <span class="valor-tag">urgente</span></div>
      <p>Terminar práctica de jQuery.</p>
    </div>
    <div class="cardx">
      <div class="tag">Etiqueta: <span class="valor-tag">personal</span></div>
      <p>Comprar pan y leche.</p>
    </div>
    <div class="cardx">
      <div class="tag">Etiqueta: <span class="valor-tag">estudio</span></div>
      <p>Repasar pseudo-selectores.</p>
    </div>
    <div class="cardx">
      <div class="tag">Etiqueta: <span class="valor-tag">urgente</span></div>
      <p>Enviar la tarea antes de las 23:59.</p>
    </div>

    <hr>

    <div class="row g-2 align-items-end">
      <div class="col-sm-6">
        <label class="form-label"><b>Etiqueta</b></label>
        <select id="selEtiqueta" class="form-select">
          <option>urgente</option>
          <option>personal</option>
          <option>estudio</option>
        </select>
      </div>
      <div class="col-sm-6">
        <label class="form-label"><b>Color texto</b></label>
        <select id="selColor" class="form-select">
          <option value="black">Black</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
      </div>

      <div class="col-12 mt-2">
        <button id="btnFiltrar" class="btn btn-primary">Filtrar</button>
        <button id="btnReset" class="btn btn-secondary">Reset</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function(){
        
      $('body').prepend('<h2 style="text-align:center">Fran</h2>');

      $.fn.resaltar = function(fondo, colorTexto){
            return $(this).css({'background-color' : fondo, 'color' : colorTexto});
      }

      $.fn.normal = function(){
            return this.css({'background-color': '', 'color': ''});
      }

      $.expr[':'].etiqueta = function(elem,i,meta){

            if ($(elem).find('.valor-tag').text().toLowerCase() === meta[3]){
                return true;
            } else {
                return false;
            }

      }

      $('#btnFiltrar').click(function() {

            let color = $('#selColor').val();
            let etiqueta = $('#selEtiqueta').val();
            $('.cardx:etiqueta('+ etiqueta +')').resaltar("yellow", color);

      });

      $('#btnReset').click(function() {

            $('.cardx').normal();

      });

      
    });
  </script>
</body>
</html>
