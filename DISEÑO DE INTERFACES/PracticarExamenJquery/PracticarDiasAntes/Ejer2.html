<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejercicio B</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .wrap{max-width:720px;margin:28px auto;border:2px solid #e91e63;padding:18px;border-radius:12px}
    .infantil{ color: green; }     /* verde */
    .comedia{ color: blue; }      /* azul */
    .misterio{ color: orange; }   /* naranja */
  </style>
</head>
<body>
  <div class="wrap">
    <h3 class="text-center">Películas</h3>
    <ul>
      <li class="infantil">Toy Story</li>
      <li class="misterio">Chantaje</li>
      <li class="comedia">Focus</li>
      <li class="infantil">Vaiana</li>
      <li class="comedia">El padre de la novia</li>
      <li class="misterio">Durmiendo con su enemigo</li>
    </ul>

    <div class="form-group" id="combo">
      <label for="color" class="form-label"><b>COLOR:</b></label>
      <select class="form-select w-50" id="color">
        <option>blue</option>
        <option>green</option>
        <option>orange</option>
      </select>
      <br>
      <input type="button" id="boton" class="btn btn-primary" value="Parpadear"/>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function(){
      $('body').prepend('<h2 style="text-align:center">Fran</h2>');

      $.fn.parpadear = function(){
        return $(this).fadeOut("slow").fadeIn("slow");
      }

      $.expr[':'].color = function(elem, i, meta){

        return $(elem).text() === meta[3];
          
      }

      $('#boton').click(function() {

        let color = $('#color').val();
        $('ul li:color('+ color +')').parpadear();

      });

      // - Debe comparar el COLOR COMPUTADO del li con el pedido
      // - param llega en español (azul/verde/naranja) y se debe normalizar al formato correcto (rgb/rgba)

      // TODO: click -> $('ul li:color('+color+')').parpadear()
    });
  </script>
</body>
</html>
