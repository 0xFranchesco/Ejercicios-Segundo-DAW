<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejercicio C</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .wrap{max-width:760px;margin:28px auto;border:2px solid #7b1fa2;padding:18px;border-radius:12px}
    ul{list-style: disc;margin-left:18px}
    li{cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <h3 class="text-center">Lista de libros</h3>
    <ul id="lista">
      <li>Inferno (Dan Brown)</li>
      <li>El último Catón (Matilde Asensi)</li>
      <li>El códice Maya (Douglas Preston)</li>
      <li>Tiranoasaurio (Douglas Preston)</li>
      <li>Todo bajo el cielo (Matilde Asensi)</li>
      <li>La fortaleza digital (Dan Brown)</li>
    </ul>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function(){

      $('body').prepend('<h2 style="text-align:center">Fran</h2>');

      $.fn.darEfecto = function(){
        return this.fadeOut("slow").fadeIn("slow");
      } 

      $.fn.negrita = function(){
        return this.css("font-weight", "bolder");
      }   

      $.fn.sinNegrita = function(){
        return this.css("font-weight", "normal");
      } 

      $.expr[':'].autor = function(elem, i ,meta) {
        return $(elem).text().toLowerCase().includes(meta[3].toLowerCase());
      }

      $('li').click(function() {

        let autor;
			if ($(this).text().includes('Dan Brown')) {
				autor = 'Dan Brown';
			} else if($(this).text().includes('Douglas Preston')) {
				autor = 'Douglas Preston';
			} else if($(this).text().includes('Matilde Asensi')) {
				autor =  'Matilde Asensi';
			}
			$('li').sinNegrita();
            $('li:autor('+ autor +')').darEfecto().negrita();

      });

      // TODO: click en un li
      // - 1) determinar autor del li clicado
      // - 2) $('li').sinNegrita()
      // - 3) $('li:autor('+autor+')').darEfecto().negrita()
    });
  </script>
</body>
</html>
