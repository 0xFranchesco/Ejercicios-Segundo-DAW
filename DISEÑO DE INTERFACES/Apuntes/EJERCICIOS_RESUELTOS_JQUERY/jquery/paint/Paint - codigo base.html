  <br>
  <button id="limpiar">Limpiar</button>
  
  <script>
    $(document).ready(function(){
      $.fn.ponBorde = function(color){
        return $(this).css('border',`2px solid ${color}`);
      }
      $.fn.ponFondo = function(color){
        return $(this).css('background-color',color);
      } 

      function dimeColor(elem){
        return elem.css('background-color');
      }

      $('.celda, .color').mouseenter(function(){
        $(this).ponBorde('blue');
      });

      $('.celda, .color').mouseleave(function(){
        $(this).ponBorde('grey');
      });

      $('.color').click(function(){
        let color = dimeColor($(this));
        $('#divColor').ponFondo(color);
      });

      $('.celda').click(function(){
        let color = dimeColor($('#divColor')); 
        $(this).ponFondo(color);
      });
	
      $('#limpiar').click(function(){
        $('.celda').ponFondo('white');
      })
	  });    
  </script>
