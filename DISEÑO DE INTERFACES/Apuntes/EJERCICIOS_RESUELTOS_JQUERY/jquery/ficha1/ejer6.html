<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery</title>
</head>
<body>
     <h3>Primera lista</h3>
     <ul>
        <li>primero</li>
        <li>segundo</li>
        <li>tercero</li>
        <li>cuarto</li>
     </ul>

     <h3>Segunda lista</h3>
     <ul>
        <li>quinto</li>
        <li>sexto</li>
        <li>septimo</li>
        <li>octavo</li>
     </ul>

     <button>Ocultar 1ª lista</button>

    <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.0.0/jquery.min.js'></script>
    <script>
    
        $(document).ready(function(){
            //ejercicio 5
            $('button').click(function(){
                $('ul li:first-child').hide();
            })
        })
        
    </script>
</body>
</html>
