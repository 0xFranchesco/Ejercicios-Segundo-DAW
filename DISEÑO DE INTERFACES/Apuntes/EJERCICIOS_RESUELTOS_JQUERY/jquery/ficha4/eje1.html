<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
    crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>

    <style>
        .btn{
            background-color: orange;
            font-size: 40px;
        }
    </style>
</head>
<body class="container">
    <h2 class="text-primary">JQUERY + BOOTSTRAP</h2>
    <p class="especial">Esto es un parrafo especial</p>
    <p>Esto es un parrafo normal</p>
    <p class="especial">Esto es otro parrafo especial</p>

    <label class="form-label fw-bold ">Elige color:</label>

    <div class="d-flex gap-2 align-items-center">
        <select class="form-select w-auto" id="desplegable">
            <option value="" selected disabled>Selecciona un color</option>
            <option value="black">Negro</option>
            <option value="white">Blanco</option>
            <option value="yellow">Amarillo</option>
            <option value="red">Rojo</option>
            <option value="blue">Azul</option>
            <option value="green">Velde</option>
        </select>
        <button class="btn-primary text-white fs-4" id="btnFiltrar">Cambiar párrafos especiales</button>
        <button class="btn-primary text-white fs-4" id="normal">Cambiar párrafos normales</button>

    </div>

    <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.0.0/jquery.min.js'></script>
    <script>
    
        $(document).ready(function(){     
            $('#btnFiltrar').click(function(){
                var $valDesplegable = $('#desplegable').val();
                $(`p.especial`).css('background-color', `${$valDesplegable}`);
            })
            $('#normal').click(function(){
                var $valDesplegable = $('#desplegable').val();
                $(`p:not(.especial)`).css('background-color', `${$valDesplegable}`);
            })
        })
    </script>
</body>
</html>
